<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,viewport-fit=cover">
<title>账号管家 · 游戏与应用密码管理</title>
<meta name="theme-color" content="#0ea5e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="账号管家">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230ea5e9' stroke-width='2'%3E%3Cpath d='M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f6fa; --panel:#ffffff; --panel-2:#f8fafc; --text:#1b2130; --muted:#6b7280;
  --border:#e4e8ef; --border-2:#eef1f6; --accent:#4f46e5; --accent-soft:#eef2ff;
  --accent-2:#0ea5e9; --danger:#dc2626; --danger-soft:#fee2e2; --ok:#16a34a; --warn:#d97706;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
  --radius:14px;
}
html[data-theme="dark"]{
  --bg:#0e1116; --panel:#161b23; --panel-2:#1b212b; --text:#e7eaf0; --muted:#96a0b0;
  --border:#262d38; --border-2:#20262f; --accent:#7c8cff; --accent-soft:#202743;
  --danger:#f87171; --danger-soft:#3b1d1d; --ok:#4ade80; --warn:#fbbf24;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
.hidden{display:none !important}
.icon{flex:none;vertical-align:-3px}

/* ---------- 锁屏 ---------- */
.lock-screen{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(1200px 600px at 50% -10%, var(--accent-soft), var(--bg));
  padding:20px; z-index:100;
}
.lock-card{
  width:100%; max-width:400px; background:var(--panel); border:1px solid var(--border);
  border-radius:18px; box-shadow:var(--shadow); padding:32px 28px; text-align:center;
}
.lock-logo{
  width:56px;height:56px;margin:0 auto 14px;border-radius:16px;background:var(--accent-soft);
  color:var(--accent); display:flex;align-items:center;justify-content:center;
}
.lock-card h1{margin:0 0 6px;font-size:20px;letter-spacing:.5px}
.lock-sub{color:var(--muted);margin:0 0 22px;font-size:13px}
.lock-form{display:flex;flex-direction:column;gap:10px;text-align:left}
.lock-foot{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.7}
.lock-foot button{
  background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;padding:0 2px;text-decoration:underline
}
.lock-tip{
  background:var(--panel-2);border:1px solid var(--border-2);border-radius:10px;
  padding:10px 12px;font-size:12px;color:var(--muted);line-height:1.7;text-align:left
}

/* ---------- 布局 ---------- */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:236px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:16px 12px;gap:4px;
}
.brand{display:flex;align-items:center;gap:9px;padding:6px 8px 16px;font-weight:600;font-size:15px}
.brand .mark{
  width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center
}
.nav-title{font-size:11px;color:var(--muted);padding:12px 10px 6px;letter-spacing:1px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;
  color:var(--text);font-size:13.5px;user-select:none
}
.nav-item:hover{background:var(--panel-2)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .count{margin-left:auto;font-size:11px;color:var(--muted);background:var(--panel-2);padding:1px 7px;border-radius:20px}
.nav-item.active .count{background:#fff;color:var(--accent)}
html[data-theme="dark"] .nav-item.active .count{background:#0e1116}
.sidebar-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:2px}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{
  display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border);
  background:var(--panel);
}
.search-wrap{position:relative;flex:1;max-width:420px}
.search-wrap .icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-wrap input{
  width:100%;padding:9px 12px 9px 34px;border:1px solid var(--border);border-radius:10px;
  background:var(--panel-2);color:var(--text);font-size:13.5px;outline:none
}
.search-wrap input:focus{border-color:var(--accent);background:var(--panel)}
.spacer{flex:1}
.content{flex:1;overflow:auto;padding:18px 20px 40px}

/* ---------- 控件 ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;
  border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:13.5px;
  transition:.15s
}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--panel-2);color:var(--text)}
.btn.icon-only{padding:8px;width:34px;justify-content:center}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
input,select,textarea{
  font-family:inherit;font-size:13.5px;color:var(--text);background:var(--panel);
  border:1px solid var(--border);border-radius:9px;padding:8px 10px;outline:none;width:100%
}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.seg button{
  border:none;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted);
  display:inline-flex;align-items:center;gap:6px;font-size:13px
}
.seg button.active{background:var(--panel);color:var(--accent);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}

/* ---------- 统计 ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.stat{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 15px;cursor:pointer;transition:.15s
}
.stat:hover{border-color:var(--accent);transform:translateY(-1px)}
.stat .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .v{font-size:22px;font-weight:700;margin-top:6px;letter-spacing:.5px}
.stat.warn .v{color:var(--warn)}
.stat.danger .v{color:var(--danger)}

/* ---------- 卡片 ---------- */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:13px}
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:15px;
  box-shadow:var(--shadow);position:relative;transition:.15s
}
.card:hover{border-color:var(--accent)}
.card-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:11px}
.avatar{
  width:36px;height:36px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:15px
}
.card-title{font-weight:650;font-size:14.5px;line-height:1.35;word-break:break-all}
.badge{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 7px;border-radius:20px;
  background:var(--panel-2);color:var(--muted);border:1px solid var(--border);margin-top:4px
}
.fav-btn{
  margin-left:auto;border:none;background:none;cursor:pointer;color:var(--muted);padding:2px;line-height:0
}
.fav-btn.on{color:var(--warn)}
.rows{display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:8px;font-size:13px}
.row .lb{color:var(--muted);font-size:12px;width:44px;flex:none}
.row .val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .val.mask{letter-spacing:2px}
.row .act{border:none;background:none;cursor:pointer;color:var(--muted);padding:3px;line-height:0;border-radius:6px}
.row .act:hover{color:var(--accent);background:var(--panel-2)}
.card-foot{display:flex;gap:6px;margin-top:12px;padding-top:11px;border-top:1px solid var(--border-2)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:11px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:20px}
.remark{margin-top:9px;font-size:12px;color:var(--muted);line-height:1.6;word-break:break-word}

/* ---------- 表格 ---------- */
.tbl-wrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border-2);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--panel-2);position:sticky;top:0}
tbody tr:hover{background:var(--panel-2)}
td .ops-in{display:flex;gap:4px}

/* ---------- 空状态 ---------- */
.empty{
  text-align:center;padding:70px 20px;color:var(--muted)
}
.empty .big{font-size:40px;margin-bottom:10px;opacity:.35}
.empty h3{margin:0 0 6px;color:var(--text);font-size:15px}
.empty p{margin:0 0 16px;font-size:13px}

/* ---------- 弹窗（HTML5 dialog） ---------- */
.modal-d{padding:0;border:none;border-radius:16px;background:var(--panel);width:92%;max-width:560px;max-height:92vh;overflow:auto;color:var(--text);box-shadow:var(--shadow);border:2px solid var(--accent-2);display:flex;flex-direction:column;animation:pop .16s ease-out}
.modal-d::backdrop{background:rgba(15,20,30,.5)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal-head h2{margin:0;font-size:15.5px}
.modal-body{padding:18px;display:flex;flex-direction:column;gap:13px}
.modal-foot{display:flex;gap:9px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--border)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pwd-line{display:flex;gap:7px}
.pwd-line input{flex:1}
.strength{height:5px;border-radius:5px;background:var(--border);overflow:hidden;margin-top:6px}
.strength i{display:block;height:100%;border-radius:5px;transition:.2s}
.slabel{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between}
.help-list{font-size:13px;line-height:1.85;color:var(--muted)}
.help-list b{color:var(--text)}
.help-list li{margin-bottom:3px}

/* ---------- 提示 ---------- */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  background:#1f2937;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;
  box-shadow:0 8px 20px rgba(0,0,0,.2);animation:up .2s ease-out
}
html[data-theme="dark"] .toast{background:#374151}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.err{color:var(--danger);font-size:12.5px;min-height:16px}

@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border);flex-direction:row;overflow-x:auto;padding:10px;gap:6px}
  .sidebar .nav-title{display:none}
  .sidebar-foot{margin:0;padding:0 0 0 10px;border:none;flex-direction:row;align-items:center;gap:4px}
  .brand{padding:0 8px 0 4px}
  .nav-item{white-space:nowrap}
  .topbar{flex-wrap:wrap}
}
</style>
</head>
<body>

<!-- 锁屏 -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-card">
    <div class="lock-logo" id="lockLogo"></div>
    <h1 id="lockTitle">账号管家</h1>
    <p class="lock-sub" id="lockSub">请输入主密码以解锁</p>
    <form class="lock-form" id="lockForm" autocomplete="off">
      <input type="password" id="pwd1" placeholder="主密码" autocomplete="new-password">
      <input type="password" id="pwd2" placeholder="再次确认主密码" autocomplete="new-password" style="display:none">
      <div class="err" id="lockErr"></div>
      <button class="btn primary" id="lockBtn" type="submit" style="justify-content:center;padding:10px">解锁</button>
    </form>
    <div class="lock-foot" id="lockFoot"></div>
    <div style="margin-top:14px;font-size:11px;color:var(--muted);opacity:.7">账号管家 v2.2 · 2026-10-04 版</div>
  </div>
</div>

<!-- 主应用 -->
<div class="app hidden" id="app">
  <aside class="sidebar">
    <div class="brand"><span class="mark" id="brandMark"></span><span>账号管家</span></div>
    <div class="nav-title">分类</div>
    <div id="navTypes"></div>
    <div class="nav-title">标签</div>
    <div id="navTags"></div>
    <div class="sidebar-foot">
      <div class="nav-item" data-act="export"><span class="ic"></span>备份 / 导出</div>
      <div class="nav-item" data-act="settings"><span class="ic"></span>设置</div>
      <div class="nav-item" data-act="help"><span class="ic"></span>使用说明</div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="search-wrap">
        <span id="searchIcon"></span>
        <input id="search" placeholder="搜索名称 / 账号 / 大区 / 角色名 / 备注…" autocomplete="off">
      </div>
      <div class="spacer"></div>
      <div class="seg" id="viewSeg">
        <button data-view="grid" class="active"></button>
        <button data-view="table"></button>
      </div>
      <select id="sortSel" style="width:auto">
        <option value="updated">最近修改</option>
        <option value="created">创建时间</option>
        <option value="name">名称 A-Z</option>
        <option value="type">按类型</option>
      </select>
      <button class="btn ghost icon-only" id="themeBtn" title="切换主题"></button>
      <button class="btn ghost icon-only" id="lockBtn2" title="立即锁定"></button>
      <button class="btn primary" id="addBtn"></button>
    </div>

    <div class="content">
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <div class="nav-title" style="padding:0" id="listTitle"></div>
        <div class="spacer"></div>
        <span id="listCount" style="color:var(--muted);font-size:12.5px"></span>
      </div>
      <div id="list"></div>
    </div>
  </main>
</div>

<dialog id="modalRoot" class="modal-d"></dialog>
<div id="toast"></div>

function b64(buf){ var b=new Uint8Array(buf),s='',i; for(i=0;i<b.length;i++){ s+=String.fromCharCode(b[i]); } return btoa(s); }
function unb64(str){ var s=atob(str),b=new Uint8Array(s.length),i; for(i=0;i<s.length;i++){ b[i]=s.charCodeAt(i); } return b; }
function nowISO(){ return new Date().toISOString(); }

/* ---------- 加密 ---------- */
function hasCrypto(){ return !!(window.crypto && window.crypto.subtle); }
function deriveKey(pwd,salt){
  var km = crypto.subtle.importKey('raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveKey']);
  return km.then(function(k){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:KDF_ITER,hash:'SHA-256'}, k,
      {name:'AES-GCM',length:256}, false, ['encrypt','decrypt']);
  });
}
function encryptPayload(obj,key){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  return crypto.subtle.encrypt({name:'AES-GCM',iv:iv}, key, new TextEncoder().encode(JSON.stringify(obj)))
    .then(function(ct){ return {iv:b64(iv), data:b64(ct)}; });
}
function decryptPayload(enc,key){
  return crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(enc.iv)}, key, unb64(enc.data))
    .then(function(pt){ return JSON.parse(new TextDecoder().decode(pt)); });
}
function persist(){
  if(!state.key) return Promise.resolve();
  var payload={ m:MAGIC, items:state.items, settings:state.settings, updatedAt:Date.now() };
  return encryptPayload(payload,state.key).then(function(enc){
    localStorage.setItem(LS_KEY, JSON.stringify({v:1,salt:state.saltB64,iv:enc.iv,data:enc.data}));
  }).then(function(){ schedulePush(); });
}

    : (state.items.length ? '' : '<div class="lock-tip">忘记主密码？本机数据将无法解密。你可以 <button id="resetBtn">清空数据并重新创建</button>（旧数据不可恢复）。</div>');
  if(!isSetup && !state.items.length){
    var rb=$('#resetBtn');
    if(rb) rb.onclick=function(){
      if(confirm('确定清空本机所有账号数据并重新创建密码库吗？\n此操作不可恢复！')){
        localStorage.removeItem(LS_KEY); state.items=[]; state.settings=defaultSettings(); showLock('setup');
      }
    };
  }
  $('#lockScreen').classList.remove('hidden');

}
$('#lockForm').addEventListener('submit',function(e){
  e.preventDefault();
  var p1=$('#pwd1').value, p2=$('#pwd2').value;
  var setup = $('#pwd2').style.display!=='none';
  $('#lockErr').textContent='';
  if(!p1){ $('#lockErr').textContent='请输入主密码'; return; }
  if(setup){
    if(p1.length<6){ $('#lockErr').textContent='主密码至少 6 位'; return; }
    if(p1!==p2){ $('#lockErr').textContent='两次输入的密码不一致'; return; }
    createVault(p1);
  }else{
    unlock(p1);
  }
});

function createVault(pwd){
  var btn=$('#lockBtn'); btn.disabled=true; btn.textContent='正在加密…';
  var salt=crypto.getRandomValues(new Uint8Array(16));
  var t0=Date.now();
  deriveKey(pwd,salt).then(function(key){
    state.key=key; state.saltB64=b64(salt); state.items=[]; state.settings=defaultSettings();
    return persist();
  }).then(function(){
    btn.disabled=false;
    var cost=Date.now()-t0;
    enterApp();
    toast('密码库已创建（密钥派生耗时 '+cost+'ms）');
  }).catch(function(err){
    btn.disabled=false; btn.textContent='创建并进入';
    $('#lockErr').textContent='创建失败：'+err.message;
  });
}
function unlock(pwd){
  var raw;
  try{ raw=JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){ raw=null; }
  if(!raw){ showLock('setup'); return; }
  var btn=$('#lockBtn'); btn.disabled=true; btn.textContent='正在解密…';
  deriveKey(pwd, unb64(raw.salt)).then(function(key){
    return decryptPayload(raw,key).then(function(p){
      if(!p || p.m!==MAGIC) throw new Error('bad');
      state.key=key; state.saltB64=raw.salt;
      state.items=Array.isArray(p.items)?p.items:[];
      state.settings=Object.assign(defaultSettings(), p.settings||{});
      return true;
    }).catch(function(){ return false; });
  }).then(function(ok){
    btn.disabled=false; btn.textContent='解锁';
    if(ok){ enterApp(); }
    else { $('#lockErr').textContent='主密码错误，无法解密'; $('#pwd1').select(); }
  }).catch(function(err){
    btn.disabled=false; btn.textContent='解锁';
    $('#lockErr').textContent='解锁失败：'+err.message;
  });
}
function lockNow(){
  state.unlocked=false; state.key=null; state.items=[]; state.revealed={};
  $('#app').classList.add('hidden');

}

/* ---------- 统计与筛选 ---------- */
function pwdScore(p){
  if(!p) return 0;
  var s=0; s+=Math.min(p.length,16)*3;
  if(/[a-z]/.test(p)) s+=5;
  if(/[A-Z]/.test(p)) s+=5;
  if(/[0-9]/.test(p)) s+=5;
  if(/[^A-Za-z0-9]/.test(p)) s+=9;
  if(p.length>=12) s+=8;
  if(/^(123456|12345678|123456789|111111|000000|password|abc123|qwerty|iloveyou|admin|a123456|5201314)$/i.test(p)) s=6;
  if(/^(.)\1+$/.test(p)) s=6;
  return Math.max(0,Math.min(100,s));
}
function pwdLevel(p){
  var s=pwdScore(p);
  if(!p) return {t:'无',c:'var(--muted)',v:0};
  if(s<40) return {t:'弱',c:'var(--danger)',v:s};
  if(s<70) return {t:'中',c:'var(--warn)',v:s};
  return {t:'强',c:'var(--ok)',v:s};
}
function weakSet(){
  var m={};
  state.items.forEach(function(it){ if(it.password && pwdScore(it.password)<40) m[it.id]=1; });
  return m;
}
function dupSet(){
  var c={},m={};
  state.items.forEach(function(it){ if(!it.password) return; c[it.password]=(c[it.password]||0)+1; });
  state.items.forEach(function(it){ if(it.password && c[it.password]>1) m[it.id]=1; });
  return m;
}
function countBy(type){
  if(type==='all') return state.items.length;
  if(type==='fav') return state.items.filter(function(i){ return i.fav; }).length;
  return state.items.filter(function(i){ return i.type===type; }).length;
}
function visibleItems(){
  var q=state.search.trim().toLowerCase();
  var f=state.filter;
  var weak=weakSet(), dup=dupSet();
  var arr=state.items.filter(function(it){
    if(f.type!=='all' && it.type!==f.type) return false;
    if(f.fav && !it.fav) return false;
    if(f.tag && (it.tags||[]).indexOf(f.tag)<0) return false;
    if(f.special==='weak' && !weak[it.id]) return false;
    if(f.special==='dup' && !dup[it.id]) return false;
    if(q){
      var hay=[it.title,it.account,it.password,it.region,it.role,it.rank,it.phone,it.email,it.url,it.remark,(it.tags||[]).join(' ')]
        .join(' ').toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
  var s=state.settings.sort||'updated';
  arr.sort(function(a,b){
    if(s==='name') return String(a.title||'').localeCompare(String(b.title||''),'zh');
    if(s==='type') return (a.type||'').localeCompare(b.type||'') || String(a.title||'').localeCompare(String(b.title||''),'zh');
    if(s==='created') return (b.createdAt||0)-(a.createdAt||0);
    return (b.updatedAt||0)-(a.updatedAt||0);
  });
  return arr;
}

function genPassword(len){
  len=len||16;
  var lower='abcdefghijkmnopqrstuvwxyz', upper='ABCDEFGHJKLMNPQRSTUVWXYZ',
      num='23456789', sym='!@#$%^&*()-_=+?';
  var all=lower+upper+num+sym, out='', i;
  var rnd=function(n){ return crypto.getRandomValues(new Uint32Array(1))[0]%n; };
  out+=lower[rnd(lower.length)]+upper[rnd(upper.length)]+num[rnd(num.length)]+sym[rnd(sym.length)];
  for(i=4;i<len;i++){ out+=all[rnd(all.length)]; }
  return out.split('').sort(function(){ return rnd(3)-1; }).join('');
}

/* ---------- 复制 ---------- */
var clearTimer=null;
function copyText(t){
  if(t==null||t===''){ toast('内容为空'); return; }
  var done=function(){ toast('已复制（15 秒后自动清除剪贴板）');
    clearTimeout(clearTimer);
    clearTimer=setTimeout(function(){ try{ navigator.clipboard.writeText(''); }catch(e){} },15000);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(function(){ legacyCopy(t,done); });
  }else{ legacyCopy(t,done); }
}
function legacyCopy(t,done){
  var ta=document.createElement('textarea'); ta.value=t;
  ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请手动选择'); }
  ta.remove();
}

function openChangePwd(){
  var body='<label class="fld"><span>当前主密码</span><input type="password" id="c_old"></label>'+
    '<label class="fld"><span>新主密码（至少 6 位）</span><input type="password" id="c_new"></label>'+
    '<label class="fld"><span>确认新主密码</span><input type="password" id="c_new2"></label>'+
    '<div class="err" id="c_err"></div>'+
    '<div style="font-size:12px;color:var(--muted);line-height:1.7">修改后请牢记新密码，并用它来打开以后导出的备份文件。</div>';
  openModal('修改主密码', body,
    '<button class="btn" data-close="1">取消</button><button class="btn primary" id="c_ok">确认修改</button>');
  var R=$('#modalRoot');
  $('#c_ok',R).onclick=function(){
    var o=$('#c_old',R).value,n=$('#c_new',R).value,n2=$('#c_new2',R).value;
    var err=function(m){ $('#c_err',R).textContent=m; };
    err('');
    if(!o||!n){ err('请填写完整'); return; }
    if(n.length<6){ err('新密码至少 6 位'); return; }
    if(n!==n2){ err('两次新密码不一致'); return; }
    var raw=JSON.parse(localStorage.getItem(LS_KEY));
    deriveKey(o, unb64(raw.salt)).then(function(k){
      return decryptPayload(raw,k).then(function(p){
        if(!p||p.m!==MAGIC) throw new Error('bad'); return p;
      });
    }).then(function(p){
      var salt=crypto.getRandomValues(new Uint8Array(16));
      return deriveKey(n,salt).then(function(nk){
        state.saltB64=b64(salt); state.key=nk;
        state.items=p.items||state.items; state.settings=Object.assign(defaultSettings(),p.settings||{});
        return persist();
      });
    }).then(function(){
      closeModal(); toast('主密码已更新，请牢记新密码');
    }).catch(function(){
      err('当前主密码不正确');
    });
  };
}
function openImport(){
  var body='<div class="lock-tip">选择之前导出的 <b>.avb</b> 备份文件，并输入<b>该备份文件的主密码</b>。导入的记录会追加到当前库中（不会覆盖现有数据）。</div>'+
    '<label class="fld"><span>备份文件</span><input type="file" id="i_file" accept=".avb,.json,application/json"></label>'+
    '<label class="fld"><span>该备份的主密码</span><input type="password" id="i_pwd"></label>'+
    '<div class="err" id="i_err"></div>';
  openModal('导入备份', body, '<button class="btn" data-close="1">取消</button><button class="btn primary" id="i_ok">解密并导入</button>');
  var R=$('#modalRoot');
  $('#i_ok',R).onclick=function(){
    var f=$('#i_file',R).files[0];
    if(!f){ $('#i_err',R).textContent='请选择备份文件'; return; }
    var fr=new FileReader();
    fr.onload=function(){
      var raw; try{ raw=JSON.parse(fr.result); }catch(e){ $('#i_err',R).textContent='文件格式不正确'; return; }
      if(!raw || !raw.salt || !raw.data){ $('#i_err',R).textContent='不是有效的备份文件'; return; }
      deriveKey($('#i_pwd',R).value, unb64(raw.salt)).then(function(k){
        return decryptPayload(raw,k).then(function(p){
          if(!p||p.m!==MAGIC) throw new Error('bad');
          return p;
        });
      }).then(function(p){
        var incoming=p.items||[];
        if(!incoming.length){ $('#i_err',R).textContent='备份中没有记录'; return; }
        var exist={};
        state.items.forEach(function(x){ exist[x.title+'|'+x.account+'|'+x.password]=1; });
        var added=0;
        incoming.forEach(function(x){
          var key=(x.title||'')+'|'+(x.account||'')+'|'+(x.password||'');
          if(exist[key]) return;
          exist[key]=1; added++;
          x.id=uid(); x.createdAt=x.createdAt||Date.now(); x.updatedAt=Date.now();
          state.items.unshift(x);
        });
        return persist().then(function(){
          closeModal(); renderAll(); toast('导入完成，新增 '+added+' 条（跳过重复 '+(incoming.length-added)+' 条）');
        });
      }).catch(function(){ $('#i_err',R).textContent='密码错误或文件已损坏'; });
    };
    fr.readAsText(f);
  };
}
/* ---------- 云同步（端到端加密 / 零知识） ---------- */
function finger(x){ return (x.title||'')+'|'+(x.account||'')+'|'+(x.password||''); }
function syncReady(){
  var s=state.settings.sync;
  if(!s || !s.enabled || !s.syncId || !state.unlocked || !state.key) return false;
  if(s.backend==='github') return !!(s.token2 && s.gistId);
  return !!(s.url);
}
function syncError(){
  var s=state.settings.sync;
  if(!s || !s.enabled) return '请先在设置中开启云同步';
  if(!s.syncId) return '请填写同步 ID（跨设备一致）';
  if(s.backend==='github'){
    if(!s.token2) return '请填写 GitHub 令牌 PAT';
    if(!/^ghp_[A-Za-z0-9_]{30,}$/.test(s.token2)) return 'PAT 格式不对：必须是 classic token（以 ghp_ 开头），新版 github_pat_ 不支持 Gist';
    if(!s.gistId) return '请填写 Gist ID，或点「创建新 Gist」自动获取';
  }else{
    if(!s.url) return '请填写 Cloudflare Worker 地址';
  }
  return null;
}
function encryptForSync(){
  return encryptPayload({ m:MAGIC, items:state.items, t:Date.now() }, state.key);
}
function syncHeaders(s){ var h={}; if(s.token) h['X-Sync-Token']=s.token; return h; }
function cfGet(s){
  return fetch(s.url+'?id='+encodeURIComponent(s.syncId), {headers:syncHeaders(s)})
    .then(function(r){ if(r.status===404) return ''; if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); });
}
function cfPut(s, body){
  return fetch(s.url+'?id='+encodeURIComponent(s.syncId), {method:'PUT',
    headers:Object.assign({'content-type':'application/json'}, syncHeaders(s)), body:body})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); });
}
function ghHeaders(s){ var h={'accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}; if(s.token2) h['authorization']='Bearer '+s.token2; return h; }
function ghErr(r){
  return r.text().then(function(t){ throw new Error('HTTP '+r.status+' '+(t||'').slice(0,140)); }).catch(function(){ throw new Error('HTTP '+r.status); });
}
function ghGet(s){
  return fetch('https://api.github.com/gists/'+s.gistId, {headers:ghHeaders(s)})
    .then(function(r){ if(!r.ok) return ghErr(r); return r.json(); })
    .then(function(j){ var f=j.files && j.files['accountvault.json']; return f?f.content:''; });
}
function ghPut(s, body){
  return fetch('https://api.github.com/gists/'+s.gistId, {method:'PATCH',
    headers:Object.assign({'content-type':'application/json'}, ghHeaders(s)),
    body:JSON.stringify({files:{'accountvault.json':{content:body}}})})
    .then(function(r){ if(!r.ok) return ghErr(r); });
}
function ghCreate(s){
  if(!s.token2){ toast('请先填写 GitHub 令牌 PAT'); return Promise.resolve(); }
  if(!/^ghp_[A-Za-z0-9_]{30,}$/.test(s.token2)){ toast('PAT 格式不对：必须是 classic token（以 ghp_ 开头），新版 github_pat_ 不支持 Gist'); return Promise.resolve(); }
  return fetch('https://api.github.com/gists', {method:'POST',
    headers:Object.assign({'content-type':'application/json'}, ghHeaders(s)),
    body:JSON.stringify({description:'AccountVault 同步仓库', public:false,
      files:{'accountvault.json':{content:'{"m":"ACCTVAULT1","iv":"AAAAAAAAAAAAAAAAAAAA","data":"AAAAAAAAAAAAAAAAAAAA"}'}}})})
    .then(function(r){ if(!r.ok) return ghErr(r); return r.json(); })
    .then(function(j){ return j.id; });
}
function ghDiscover(s){
  if(!s.token2){ toast('请先填写 GitHub 令牌 PAT'); return Promise.resolve(); }
  if(!/^ghp_[A-Za-z0-9_]{30,}$/.test(s.token2)){ toast('PAT 格式不对：必须是 classic token（以 ghp_ 开头）'); return Promise.resolve(); }
  return fetch('https://api.github.com/gists', {headers:ghHeaders(s)})
    .then(function(r){ if(!r.ok) return ghErr(r); return r.json(); })
    .then(function(list){
      var found=null;
      (list||[]).forEach(function(g){ if(g.description && g.description.indexOf('AccountVault')>=0) found=found||g.id; });
      return found;
    });
}
function pullBlob(){
  var s=state.settings.sync;
  return (s.backend==='github' ? ghGet(s) : cfGet(s)).then(function(text){
    if(!text) return null;
    var obj; try{ obj=JSON.parse(text); }catch(e){ throw new Error('云端数据损坏'); }
    if(!obj.iv || !obj.data || obj.data.length<20) return null; // 空占位，尚未有数据
    return decryptPayload(obj, state.key);
  });
}
function mergeItems(remote){
  var byId={}, byFinger={}, added=0;
  state.items.forEach(function(x){ byId[x.id]=x; byFinger[finger(x)]=x; });
  (remote||[]).forEach(function(r){
    if(!r) return;
    var f=finger(r);
    if(byId[r.id]){ var l=byId[r.id]; if((r.updatedAt||0)>(l.updatedAt||0)) Object.assign(l,r); return; }
    if(byFinger[f]){ var l2=byFinger[f]; if((r.updatedAt||0)>(l2.updatedAt||0)) Object.assign(l2,r); return; }
    added++; r.createdAt=r.createdAt||Date.now(); r.updatedAt=r.updatedAt||Date.now();
    state.items.unshift(r); byId[r.id]=r; byFinger[f]=r;
  });
  return added;
}
function pushSync(){
  var err=syncError(); if(err){ toast(err); return; }
  var s=state.settings.sync;
  encryptForSync().then(function(enc){
    return (s.backend==='github' ? ghPut(s, JSON.stringify({iv:enc.iv,data:enc.data}))
                                : cfPut(s, JSON.stringify({iv:enc.iv,data:enc.data})));
  }).then(function(){
    state.settings.sync.lastSync=Date.now(); persist();
    toast('已上传到云端');
  }).catch(function(err){
    console.warn('pushSync failed', err); toast('上传失败：'+(err&&err.message||err));
  });
}
function pullSync(){
  var err=syncError(); if(err){ toast(err); return; }
  pullBlob().then(function(payload){
    if(!payload) return;
    if(payload.m!==MAGIC) throw new Error('主密码与云端不一致');
    var added=mergeItems(payload.items||[]);
    state.settings.sync.lastSync=payload.t||Date.now();
    return persist().then(function(){
      renderAll();
      toast(added ? ('已同步，合并 '+added+' 条新记录') : '已同步（无新记录）');
    });
  }).catch(function(err){
    console.warn('pullSync failed', err);
    if(/不一致|损坏/.test(err.message)) toast(err.message); else toast('拉取失败：'+(err&&err.message||err));
  });
}
var _pushTimer=null;
function schedulePush(){
  var s=state.settings.sync;
  if(!s || !s.auto || !syncReady()) return;
  clearTimeout(_pushTimer);
  _pushTimer=setTimeout(pushSync, 800);
}

function openHelp(){
  var body='<ul class="help-list">'+
    '<li><b>保存游戏账号</b>：类型选「游戏」，填写名称、账号、密码，以及<b>大区</b>和<b>角色名</b>（还可填段位/等级）。</li>'+
    '<li><b>保存应用/网站账号</b>：类型选「应用」或「网站」，填写名称、账号、密码，可补充网址、绑定手机/邮箱。</li>'+
    '<li><b>一键复制</b>：点行尾的复制图标即可，15 秒后自动清空剪贴板。</li>'+
    '<li><b>密码生成器</b>：编辑时点骰子图标，自动生成 16 位强随机密码。</li>'+
    '<li><b>搜索</b>：顶部搜索框支持名称、账号、大区、角色名、备注全字段匹配。</li>'+
    '<li><b>安全体检</b>：顶部「弱密码」「重复密码」卡片可直接点开筛选，建议尽快修改。</li>'+
    '</ul>'+
    '<div style="border-top:1px solid var(--border);padding-top:13px">'+
      '<div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">快捷键</div>'+
      '<div style="font-size:13px;line-height:2">Ctrl/⌘ + F　搜索<br>Ctrl/⌘ + N　新增账号<br>Ctrl/⌘ + L　立即锁定<br>Esc　关闭弹窗</div>'+
    '</div>'+
    '<div class="lock-tip">数据只存在<b>这台电脑</b>上，不会上传到任何服务器。请定期用「备份 / 导出」保存一份 .avb 文件到 U 盘或网盘，防止浏览器数据被清理。</div>';
  openModal('使用说明', body, '');
}

/* ---------- 事件绑定 ---------- */
$('#navTypes').addEventListener('click',function(e){
  var el=e.target.closest('.nav-item'); if(!el) return;
  if(el.dataset.fav){ state.filter={type:'all',fav:true,tag:null,special:null}; }
  else { state.filter={type:el.dataset.type,fav:false,tag:null,special:null}; }
  renderAll();
});
$('#navTags').addEventListener('click',function(e){
  var el=e.target.closest('.nav-item'); if(!el) return;
  var t=el.dataset.tag;
  state.filter = (state.filter.tag===t) ? {type:'all',fav:false,tag:null,special:null} : {type:'all',fav:false,tag:t,special:null};
  renderAll();
});
$('.sidebar-foot').addEventListener('click',function(e){
  var el=e.target.closest('.nav-item'); if(!el) return;
  var a=el.dataset.act;
  if(a==='export'){ openSettings(); }
  else if(a==='settings'){ openSettings(); }
  else if(a==='help'){ openHelp(); }
});
$('#stats').addEventListener('click',function(e){
  var el=e.target.closest('.stat'); if(!el) return;
  var s=el.dataset.stat;
  if(s==='weak'||s==='dup'){ state.filter={type:'all',fav:false,tag:null,special:s}; }
  else { state.filter={type:s,fav:false,tag:null,special:null}; }
  renderAll();
});
$('#list').addEventListener('click',function(e){
  var btn=e.target.closest('[data-act]'); if(!btn) return;
  var act0=btn.dataset.act;
  if(act0==='add'){ openEditor(null); return; }
  var host=e.target.closest('[data-id]'); if(!host) return;
  var id=host.dataset.id;
  var it=state.items.filter(function(x){ return x.id===id; })[0]; if(!it) return;
  var act=btn.dataset.act, field=btn.dataset.field;
  if(act==='copy'){ copyText(it[field]); }
  else if(act==='pwd'){ copyText(it.password); }
  else if(act==='copy-pwd'){ copyText(it.password); }
  else if(act==='toggle'){
    state.revealed[id]=!state.revealed[id];
    renderList();
  }
  else if(act==='fav'){ it.fav=!it.fav; it.updatedAt=Date.now(); persist().then(renderAll); }
  else if(act==='edit'){ openEditor(id); }
  else if(act==='del'){
    if(confirm('确定删除「'+it.title+'」吗？删除后无法恢复。')){
      state.items=state.items.filter(function(x){ return x.id!==id; });
      persist().then(function(){ renderAll(); toast('已删除'); });
    }
  }
});
$('#search').addEventListener('input',function(){ state.search=this.value; renderList(); });
$('#sortSel').addEventListener('change',function(){ state.settings.sort=this.value; persist(); renderList(); });
$('#viewSeg').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  setView(b.dataset.view); persist(); renderList();
});
$('#addBtn').onclick=function(){ openEditor(null); };
$('#themeBtn').onclick=function(){
  state.settings.theme = state.settings.theme==='dark'?'light':'dark';
  applyTheme(); persist();
};
$('#lockBtn2').onclick=lockNow;
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ closeModal(); return; }
  var mod=e.ctrlKey||e.metaKey;
  if(mod && e.key.toLowerCase()==='f'){ e.preventDefault(); $('#search').focus(); $('#search').select(); }
  else if(mod && e.key.toLowerCase()==='n' && state.unlocked){ e.preventDefault(); openEditor(null); }
  else if(mod && e.key.toLowerCase()==='l' && state.unlocked){ e.preventDefault(); lockNow(); }
});
$('#modalRoot').addEventListener('click',function(e){
  if(e.target===this || e.target.closest('.modal-close')) closeModal();
});

/* ---------- 自动锁定 ---------- */
var lastAct=Date.now();
['mousedown','keydown','input','scroll','touchstart'].forEach(function(ev){
  document.addEventListener(ev,function(){ lastAct=Date.now(); },{passive:true});
});
setInterval(function(){
  if(!state.unlocked) return;
  var t=state.settings.autoLock||0;
  if(t>0 && Date.now()-lastAct > t*1000){
    toast('长时间无操作，已自动锁定'); lockNow();
  }
},5000);

/* ---------- 启动 ---------- */
$('#brandMark').innerHTML=ic('shield',17,2);
$('#searchIcon').innerHTML=ic('search',16);
$('#addBtn').innerHTML=ic('plus')+'新增账号';
$('#lockBtn2').innerHTML=ic('lock');
$$('#viewSeg button').forEach(function(b){ b.innerHTML=ic(b.dataset.view==='grid'?'grid':'list',15); });
$('#themeBtn').innerHTML=ic('sun');
var footIcon={export:'download',settings:'settings',help:'help'};
$$('.sidebar-foot .nav-item').forEach(function(el){
  var s=$('.ic',el); if(s) s.outerHTML=ic(footIcon[el.dataset.act]||'settings',16);
});

if(!hasCrypto()){
  $('#lockSub').textContent='当前环境不支持 Web Crypto，请改用 Chrome / Edge 打开';
  $('#pwd1').disabled=true; $('#lockBtn').disabled=true;
  $('#lockFoot').innerHTML='<div class="lock-tip">浏览器的加密接口不可用。请使用 Chrome、Edge 或 Firefox 打开本文件（不要使用老旧浏览器或某些内置 WebView）。</div>';
}else{
  showLock(localStorage.getItem(LS_KEY)?'login':'setup');
}

if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
}
})();
